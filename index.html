<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repair Request Form</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const SUPABASE_URL = "https://ycbrwlyfnpoqtebljyld.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljYnJ3bHlmbnBvcXRlYmxqeWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NTg0NjIsImV4cCI6MjA5NjAzNDQ2Mn0.Gzs0leyGleUJjhKmmRRZ89T2u-H60SmW8uUYr5OcjSM";

function App() {
  const [form, setForm] = React.useState({ unit:"", tenant:"", company:"", phone:"", issue:"", category:"HVAC", priority:"medium", details:"" });
  const [step, setStep] = React.useState(1);
  const [tab, setTab] = React.useState("info");
  const [submitting, setSubmitting] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [files, setFiles] = React.useState([]);
  const fileRef = React.useRef(null);

  const set = (k,v) => setForm(p => ({...p, [k]:v}));

  const handleFiles = (fl) => {
    Array.from(fl).forEach(f => {
      if(f.size > 10*1024*1024){ setError(f.name+" too large. Max 10MB."); return; }
      const r = new FileReader();
      r.onload = e => setFiles(p => [...p, {name:f.name, type:f.type, dataUrl:e.target.result, size:(f.size/1024).toFixed(0)}]);
      r.readAsDataURL(f);
    });
  };

  const submit = async () => {
    setSubmitting(true); setError(null);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/repair_requests`, {
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=representation"},
        body: JSON.stringify({unit:form.unit,tenant:form.tenant,company:form.company,phone:form.phone,issue:form.issue,category:form.category,priority:form.priority,details:form.details,media:files.length>0?JSON.stringify(files):null,status:"open",submitted:new Date().toISOString().split("T")[0],contractor:null,contractor_assigned_date:null,follow_up_sent:false})
      });
      if(res.ok) setStep(2);
      else { const e = await res.json(); setError(e.message||"Submission failed."); }
    } catch(e){ setError("Network error."); }
    finally{ setSubmitting(false); }
  };

  const reset = () => { setForm({unit:"",tenant:"",company:"",phone:"",issue:"",category:"HVAC",priority:"medium",details:""}); setFiles([]); setStep(1); setTab("info"); setError(null); };

  const infoDone = form.unit && form.tenant && form.company;
  const issueDone = form.issue;

  const s = `
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=DM+Mono:wght@300;400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#F7F5F0;font-family:'Noto Serif JP',serif;}
    .input{background:#fff;border:1.5px solid #E0DBD0;color:#1A1A1A;padding:12px 16px;font-family:'DM Mono',monospace;font-size:13px;border-radius:4px;width:100%;outline:none;}
    .input:focus{border-color:#1A1A2E;}
    .input::placeholder{color:#AAA;}
    textarea.input{resize:vertical;line-height:1.7;}
    .label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:#888;text-transform:uppercase;margin-bottom:7px;display:block;}
    .btn-submit{background:#1A1A2E;color:#E8C87A;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:16px;border-radius:4px;width:100%;}
    .btn-submit:disabled{opacity:0.4;}
    .btn-next{background:#1A1A2E;color:#fff;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;border-radius:4px;}
    .btn-back{background:transparent;color:#888;border:1px solid #E0DBD0;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:12px 24px;border-radius:4px;}
    .pcard{border:1.5px solid #E0DBD0;border-radius:4px;padding:12px 16px;cursor:pointer;background:#fff;}
    .pcard.sel{border-color:#1A1A2E;background:#F0EEF8;}
    .cpill{border:1.5px solid #E0DBD0;border-radius:20px;padding:8px 16px;cursor:pointer;background:#fff;font-family:'DM Mono',monospace;font-size:11px;}
    .cpill.sel{background:#1A1A2E;color:#E8C87A;border-color:#1A1A2E;}
    .ftab{flex:1;padding:10px;text-align:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:#888;border-bottom:2px solid transparent;}
    .ftab.act{color:#1A1A2E;border-bottom-color:#1A1A2E;}
    .ftab.done{color:#34C759;}
    .drop{border:2px dashed #E0DBD0;border-radius:8px;padding:32px 20px;text-align:center;cursor:pointer;background:#FAFAF8;}
    .thumb{position:relative;border-radius:6px;overflow:hidden;border:1px solid #E0DBD0;aspect-ratio:1;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .rmv{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;}
    .sicon{width:64px;height:64px;background:#34C75918;border:2px solid #34C75940;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;}
  `;

  const priorities = [
    {v:"urgent",l:"緊急 Urgent",c:"#FF3B30",d:"Safety risk / no hot water / flooding"},
    {v:"high",  l:"高 High",    c:"#FF9500",d:"Major inconvenience, needs quick fix"},
    {v:"medium",l:"中 Medium",  c:"#FFCC00",d:"Noticeable issue, manageable for now"},
    {v:"low",   l:"低 Low",     c:"#34C759",d:"Minor issue, no rush"},
  ];
  const categories = ["HVAC","Plumbing","Structural","Security","Electrical","Other"];

  if(step===2) return (
    <div style={{fontFamily:"'Noto Serif JP',serif",background:"#F7F5F0",minHeight:"100vh"}}>
      <style>{s}</style>
      <div style={{background:"#1A1A2E",padding:"20px 24px",textAlign:"center"}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:4,color:"#E8C87A",textTransform:"uppercase",marginBottom:6}}>修理依頼フォーム</div>
        <h1 style={{fontSize:20,fontWeight:300,color:"#F7F5F0"}}>Repair Request Form</h1>
      </div>
      <div style={{maxWidth:560,margin:"0 auto",padding:"28px 20px",textAlign:"center",paddingTop:60}}>
        <div className="sicon">✓</div>
        <h2 style={{fontSize:22,fontWeight:300,marginBottom:10}}>Request Submitted</h2>
        <p style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#34C759",marginBottom:8}}>受領いたしました</p>
        <p style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"#888",lineHeight:1.8,marginBottom:32}}>
          Thank you, {form.tenant}.<br/>Your request for <strong>{form.unit}</strong> at <strong>{form.company}</strong> has been received.<br/>担当者より折り返しご連絡いたします。
        </p>
        <button onClick={reset} style={{background:"none",border:"1px solid #1A1A2E",color:"#1A1A2E",cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:11,letterSpacing:2,padding:"12px 28px",borderRadius:4}}>
          Submit Another · 新しい依頼
        </button>
      </div>
    </div>
  );

  return (
    <div style={{fontFamily:"'Noto Serif JP',serif",background:"#F7F5F0",minHeight:"100vh"}}>
      <style>{s}</style>
      <div style={{background:"#1A1A2E",padding:"20px 24px",textAlign:"center"}}>
        <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:4,color:"#E8C87A",textTransform:"uppercase",marginBottom:6}}>修理依頼フォーム</div>
        <h1 style={{fontSize:20,fontWeight:300,color:"#F7F5F0"}}>Repair Request Form</h1>
        <p style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#666",marginTop:6}}>Submit your maintenance request · メンテナンス依頼</p>
      </div>

      <div style={{background:"#fff",borderBottom:"1px solid #E8E3DA",display:"flex"}}>
        {[{k:"info",l:"① Info",done:infoDone},{k:"issue",l:"② Issue",done:issueDone},{k:"media",l:"③ Photos",done:files.length>0}].map(t=>(
          <button key={t.k} className={`ftab ${tab===t.k?"act":""} ${t.done&&tab!==t.k?"done":""}`} onClick={()=>setTab(t.k)}>
            {t.done&&tab!==t.k?"✓ ":""}{t.l}
          </button>
        ))}
      </div>

      <div style={{maxWidth:560,margin:"0 auto",padding:"24px 20px"}}>
        {tab==="info" && (
          <div>
            <div style={{background:"#fff",border:"1px solid #E8E3DA",borderRadius:6,padding:24,marginBottom:16}}>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:3,color:"#1A1A2E",textTransform:"uppercase",marginBottom:18,paddingBottom:10,borderBottom:"1px solid #F0EDE8"}}>Your Information · お客様情報</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                <div><label className="label">Condo Name マンション名 *</label><input className="input" placeholder="e.g. Park Tower" value={form.company} onChange={e=>set("company",e.target.value)}/></div>
                <div><label className="label">Unit Number 部屋番号 *</label><input className="input" placeholder="e.g. 3F, 302" value={form.unit} onChange={e=>set("unit",e.target.value)}/></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <div><label className="label">Your Name お名前 *</label><input className="input" placeholder="Tanaka Hiroshi" value={form.tenant} onChange={e=>set("tenant",e.target.value)}/></div>
                <div><label className="label">Mobile Number 携帯番号</label><input className="input" placeholder="090-1234-5678" value={form.phone} onChange={e=>set("phone",e.target.value)}/></div>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end"}}>
              <button className="btn-next" disabled={!infoDone} onClick={()=>setTab("issue")} style={{opacity:infoDone?1:0.4}}>Next → Issue Details</button>
            </div>
          </div>
        )}

        {tab==="issue" && (
          <div>
            <div style={{background:"#fff",border:"1px solid #E8E3DA",borderRadius:6,padding:24,marginBottom:16}}>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:3,color:"#1A1A2E",textTransform:"uppercase",marginBottom:18,paddingBottom:10,borderBottom:"1px solid #F0EDE8"}}>Issue Details · 問題の詳細</div>
              <div style={{marginBottom:14}}><label className="label">Issue Summary *</label><input className="input" placeholder="e.g. Air conditioning not working" value={form.issue} onChange={e=>set("issue",e.target.value)}/></div>
              <div style={{marginBottom:18}}><label className="label">Details 詳細</label><textarea className="input" rows={3} placeholder="When did it start? Any other context..." value={form.details} onChange={e=>set("details",e.target.value)}/></div>
              <div style={{marginBottom:18}}>
                <label className="label">Category カテゴリ</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {categories.map(c=><button key={c} className={`cpill ${form.category===c?"sel":""}`} style={form.category!==c?{color:"#888"}:{}} onClick={()=>set("category",c)}>{c}</button>)}
                </div>
              </div>
              <div>
                <label className="label">Urgency 緊急度</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {priorities.map(p=>(
                    <div key={p.v} className={`pcard ${form.priority===p.v?"sel":""}`} onClick={()=>set("priority",p.v)}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:p.c}}></div>
                        <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:form.priority===p.v?"#1A1A2E":"#555"}}>{p.l}</span>
                      </div>
                      <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#AAA",lineHeight:1.4}}>{p.d}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <button className="btn-back" onClick={()=>setTab("info")}>← Back</button>
              <button className="btn-next" disabled={!issueDone} onClick={()=>setTab("media")} style={{opacity:issueDone?1:0.4}}>Next → Add Photos</button>
            </div>
          </div>
        )}

        {tab==="media" && (
          <div>
            <div style={{background:"#fff",border:"1px solid #E8E3DA",borderRadius:6,padding:24,marginBottom:16}}>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:3,color:"#1A1A2E",textTransform:"uppercase",marginBottom:6,paddingBottom:10,borderBottom:"1px solid #F0EDE8"}}>Photos & Videos · 写真・動画</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#AAA",marginBottom:18}}>Optional · 任意項目</div>
              <div className="drop" onClick={()=>fileRef.current?.click()}>
                <div style={{fontSize:32,marginBottom:12}}>📷</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#1A1A2E",marginBottom:6}}>Tap to add photos or videos</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#AAA"}}>写真・動画を追加 · Max 10MB</div>
                <input ref={fileRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}>
                <button onClick={()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";i.onchange=e=>handleFiles(e.target.files);i.click();}}
                  style={{background:"#F0EEF8",border:"1px solid #1A1A2E20",borderRadius:4,padding:"10px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"#1A1A2E",cursor:"pointer"}}>
                  📸 Take Photo
                </button>
                <button onClick={()=>{const i=document.createElement("input");i.type="file";i.accept="video/*";i.capture="environment";i.onchange=e=>handleFiles(e.target.files);i.click();}}
                  style={{background:"#F0EEF8",border:"1px solid #1A1A2E20",borderRadius:4,padding:"10px",fontFamily:"'DM Mono',monospace",fontSize:10,color:"#1A1A2E",cursor:"pointer"}}>
                  🎥 Record Video
                </button>
              </div>
              {files.length>0 && (
                <div style={{marginTop:20}}>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#888",textTransform:"uppercase",marginBottom:10}}>{files.length} file{files.length>1?"s":""} added</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                    {files.map((f,i)=>(
                      <div key={i} className="thumb">
                        {f.type.startsWith("image/")?<img src={f.dataUrl} alt={f.name}/>:<div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#1A1A2E10"}}><div style={{fontSize:24}}>🎥</div></div>}
                        <button className="rmv" onClick={()=>setFiles(p=>p.filter((_,j)=>j!==i))}>×</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            {error && <div style={{background:"#FF3B3010",border:"1px solid #FF3B3040",borderRadius:4,padding:"12px 16px",marginBottom:14,fontFamily:"'DM Mono',monospace",fontSize:11,color:"#FF3B30"}}>⚠ {error}</div>}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
              <button className="btn-back" onClick={()=>setTab("issue")}>← Back</button>
            </div>
            <button className="btn-submit" disabled={!infoDone||!issueDone||submitting} onClick={submit}>
              {submitting?"Submitting...":"Submit Request · 送信する"}
            </button>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#AAA",textAlign:"center",marginTop:10}}>Photos are optional · 写真は任意です</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
